[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weber-viewer"
version = "0.1.0"
description = "Python animation frontend for the WeberElectrodynamics.jl integrator"
requires-python = ">=3.10"
authors = [{ name = "Samer" }]
dependencies = [
    "juliacall>=0.9",
    "numpy>=1.24",
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-qt>=4"]

[project.scripts]
weber-viewer-two-body = "weber_viewer.examples.two_body_streaming:main"
weber-viewer-three-body = "weber_viewer.examples.three_body_polygon:main"
weber-viewer-smoke = "weber_viewer.examples.smoke_probe:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weber_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
