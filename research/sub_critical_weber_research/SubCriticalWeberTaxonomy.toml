# Research Direction Taxonomy for Sub-Critical Weber Dynamics
#
# Each direction is scored 1-5 on five criteria:
#   theoretical_promise  — Does the math suggest this could work?
#   feasibility          — Can it be tested (symbolically/numerically) in reasonable time?
#   novelty              — Is this genuinely new vs. rehash of known failures?
#   connection           — Does it build on existing 7 experiments / 16 transforms / quantum theory?
#   scope                — If successful, does it solve the full problem or only a special case?
#
# Composite score = mean of all five.

[metadata]
version = "0.1.0"
last_updated = "2026-03-14"
description = "Systematic classification of research directions for the ℓ≠0 regularization barrier"

# =============================================================================
# Category A: Beyond Smooth Diffeomorphisms
# The topological barrier (infinite winding) applies ONLY to smooth maps.
# =============================================================================

[directions.A1_piecewise_smooth]
name = "Piecewise-smooth regularization"
category = "A_beyond_smooth"
description = """
Use different coordinate charts on angular sectors of the spiral, stitched along \
radial cuts. Each sector has finite winding. Analogous to Riemann surface construction \
for multi-valued functions."""
theoretical_promise = 3
feasibility = 4
novelty = 4
connection = 3
scope = 3
status = "untested"
key_question = "Can the stitching maps be chosen so that the dynamics is continuous across cuts?"
related_literature = ["Riemann surfaces", "sector decomposition in singular perturbation theory"]

[directions.A2_covering_space]
name = "Covering space / Riemann surface unwinding"
category = "A_beyond_smooth"
description = """
Lift dynamics to the universal cover of the punctured plane (the strip ℝ×ℝ via w=log z). \
Winding is eliminated but speed divergence remains. Question: can a non-smooth \
compactification of the strip absorb the speed divergence?"""
theoretical_promise = 3
feasibility = 3
novelty = 3
connection = 4
scope = 3
status = "partially_tested"
key_question = "The log map was tested (Experiment 7) and failed. Can a COMPACTIFICATION of the log-image work?"
notes = "Experiment 7 showed |dw/dt| ~ r^(-3/2) → ∞. Need to handle this divergence."

[directions.A3_distributional]
name = "Distributional / measure-valued continuation"
category = "A_beyond_smooth"
description = """
Replace pointwise trajectory by probability measure that spreads over angles near collision. \
Connect to quantum limit-circle analysis: the Schrödinger solution exists in L² even when \
the classical trajectory fails."""
theoretical_promise = 4
feasibility = 3
novelty = 5
connection = 5
scope = 4
status = "untested"
key_question = "What is the correct measure-valued continuation that matches the quantum L² solution?"
related_literature = ["Frauenfelder-Weber 2024", "limit circle Sturm-Liouville", "measure-valued solutions ODE"]

[directions.A4_blowup_desingularization]
name = "Blow-up and desingularization (Bendixson-Dumortier)"
category = "A_beyond_smooth"
description = """
Apply iterated blow-ups at the singular point, as in algebraic geometry resolution of \
singularities. Each blow-up replaces a point by a projective line. For ODEs, the \
Bendixson-Dumortier procedure desingularizes non-elementary singular points. The Weber \
spiral singularity IS a non-elementary singular point."""
theoretical_promise = 5
feasibility = 4
novelty = 5
connection = 4
scope = 4
status = "untested"
key_question = "Does the iterated blow-up terminate? What is the desingularized phase portrait?"
related_literature = ["Bendixson-Dumortier", "Dumortier-Llibre-Artes", "resolution of singularities"]
notes = "TOP RANKED. This is a constructive algorithm specifically designed for this class of singularity."

